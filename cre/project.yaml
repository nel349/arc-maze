# ==========================================================================
# CRE PROJECT SETTINGS FILE
# ==========================================================================
# The verdict workflow reads the maze's run store over HTTP and signs a report.
# It reads no chain and sends no transaction itself: its report is for the
# MazeVerdict contract on Arc, delivered by Chainlink's forwarder once the
# workflow is deployed. The Sepolia RPCs below are the starter template's
# defaults, and nothing here uses them.
staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com

# ==========================================================================
production-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
    - chain-name: ethereum-mainnet
      url: https://ethereum-rpc.publicnode.com
